project:
  name: smithsonian-image-text
  dataset_title: "25K Museum Images with Captions"
  target_final_images: 25000
  min_final_images: 20000
  starter_images: 5000
  max_side_px: 512
  target_package_gb: 4.0
  hard_cap_gb: 5.0
  rebuild_target_hours: 8

pilot:
  images: 1000
  deterministic_seed: "smithsonian-image-text-v1-pilot"
  workers: 12
  request_timeout_seconds: 30
  max_attempts: 4
  retry_backoff_seconds: 0.5
  max_download_bytes: 52428800
  jpeg_quality: 84
  phash_size: 8
  phash_highfreq_factor: 4
  near_duplicate_hamming_distance: 4
  min_max_side_px: 256

production:
  workers: 16
  checkpoint_every: 100

splitting:
  seed: "smithsonian-image-text-v1-split"
  train: 0.8
  validation: 0.1
  test: 0.1

starter:
  seed: "smithsonian-image-text-v1-starter"
  max_views_per_object: 2

sources:
  bulk_index_url: "https://smithsonian-open-access.s3-us-west-2.amazonaws.com/metadata/edan/index.txt"
  api_base_url: "https://api.si.edu/openaccess/api/v1.0"
  ids_host: "ids.si.edu"

metadata_discovery:
  min_candidates: 50000
  target_candidates: 80000
  max_candidates: 100000
  deterministic_seed: "smithsonian-image-text-v1"
  max_shards_per_unit: 64
  request_timeout_seconds: 60
  max_candidates_per_unit: 12000
  # Phase 2 discovery caps are intentionally not final category quotas. They
  # prevent a handful of very high-yield natural-history units from consuming
  # the full 80K pool while still allowing sparse museums to scan more shards.
  unit_candidate_caps:
    CHNDM: 12000
    FSG: 3000
    HMSG: 1000
    SAAM: 4000
    NMAH: 10000
    NASM: 1500
    NPM: 5000
    HAC: 1000
    NZP: 1000
    NMNHPALEO: 10000
    NMNHMINSCI: 8000
    NMNHBIRDS: 10000
    NMNHMAMMALS: 10000
    NMNHENTO: 10000
    NMNHFISHES: 5000
    NMNHBOTANY: 10000
    NMNHEDUCATION: 3000
  smoke_units:
    - CHNDM
    - FSG
    - NMAH
    - NMNHPALEO
  preferred_units:
    - CHNDM
    - FSG
    - HMSG
    - SAAM
    - NMAH
    - NASM
    - NPM
    - HAC
    - NZP
    - NMNHPALEO
    - NMNHMINSCI
    - NMNHBIRDS
    - NMNHMAMMALS
    - NMNHENTO
    - NMNHFISHES
    - NMNHBOTANY
    - NMNHEDUCATION

api:
  key_env_var: SMITHSONIAN_API_KEY
  rows_per_request: 100
  sort: id
  type: edanmdm
  row_group: objects
