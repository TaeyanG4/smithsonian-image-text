[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smithsonian-image-text"
version = "0.1.0"
description = "Reproducible pipeline for a rights-safe Smithsonian image-text Kaggle dataset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
data = ["numpy>=2,<3", "Pillow>=10,<12", "pyarrow>=17,<22"]
embeddings = ["torch>=2.5,<3", "transformers>=4.51,<5"]
dev = ["pytest>=8,<9", "ruff==0.8.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
